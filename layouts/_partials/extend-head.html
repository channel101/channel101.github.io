<meta
  name="description"
  content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify | safeHTML }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}"
/>
<meta
  property="og:type"
  content="{{ if .IsPage }}article{{ else }}website{{ end }}"
/>
<meta property="og:url" content="{{ .Permalink }}" />
<meta
  property="og:title"
  content="{{ if .Title }}{{ .Title }} | {{ .Site.Title }}{{ else }}{{ .Site.Params.Title }}{{ end }}"
/>
<meta
  property="og:description"
  content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify | safeHTML }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}"
/>
{{- with .Params.images -}} {{- range . -}}
<meta property="og:image" content="{{ . | absURL }}" />
{{- end -}} {{- else -}} {{- with .Site.Params.images -}}
<meta property="og:image" content="{{ index . 0 | absURL }}" />
{{- end -}} {{- end -}}

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:url" content="{{ .Permalink }}" />
<meta
  name="twitter:title"
  content="{{ if .Title }}{{ .Title }} | {{ .Site.Title }}{{ else }}{{ .Site.Params.Title }}{{ end }}"
/>
<meta
  name="twitter:description"
  content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify | safeHTML }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}"
/>
{{- with .Params.images -}}
<meta name="twitter:image" content="{{ index . 0 | absURL }}" />
{{- else -}} {{- with .Site.Params.images -}}
<meta name="twitter:image" content="{{ index . 0 | absURL }}" />
{{- end -}} {{- end -}}
